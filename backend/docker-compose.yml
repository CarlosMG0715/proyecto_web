services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-habitos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-habitos_dev}
      POSTGRES_DB: ${POSTGRES_DB:-habitos}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-habitos} -d ${POSTGRES_DB:-habitos}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
